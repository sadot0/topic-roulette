<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <rect width="32" height="32" rx="7.5" fill="#0E1016"/>
  <!-- Тёплый свет в верхнем левом углу — тот же приём, что на самой
       странице: один источник, а не равномерная заливка -->
  <defs>
    <radialGradient id="g" cx="22%" cy="16%" r="62%">
      <stop offset="0" stop-color="#E9C08A" stop-opacity=".16"/>
      <stop offset="1" stop-color="#E9C08A" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="32" height="32" rx="7.5" fill="url(#g)"/>
  <!-- Внутренняя дуга: разрыв в другом месте, отсюда ощущение хода -->
  <path d="M12.6 23.2a7.2 7.2 0 1 1 8 -1.2" fill="none" stroke="#E9C08A"
        stroke-width="1.2" stroke-linecap="round" opacity=".45"/>
  <!-- Внешнее кольцо, разомкнутое сверху под указатель -->
  <path d="M19.4 8.7a8.9 8.9 0 1 1-6.8 0" fill="none" stroke="#E9C08A"
        stroke-width="2.2" stroke-linecap="round"/>
  <!-- Указатель входит снаружи в разрыв -->
  <path d="M16 4.6v4.2" stroke="#F2EFE6" stroke-width="2.3" stroke-linecap="round"/>
  <!-- Ось -->
  <circle cx="16" cy="17.2" r="1.8" fill="#E9C08A"/>
</svg>
